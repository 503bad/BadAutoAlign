[project]
name = "vocal-align-tune"
version = "0.5.1"
description = "VocalAlignTune — MIDI/WAV guided vocal timing & pitch correction (CLI prototype)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "503 bad gateway" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pretty_midi>=0.2.10",
    "librosa>=0.10", # ISC — pYINフォールバック検出器のみ使用（pitch_shiftは使用禁止）
    "pyworld>=0.3.4", # MIT — Signalsmith Stretchバインディング
    "setuptools<81",
]

[project.optional-dependencies]
crepe = [
    "torch>=2.0",
    "torchcrepe>=0.0.22",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
vat = "vat.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vat"]

[tool.uv]
python-preference = "managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
